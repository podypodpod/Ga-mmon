name: Build

# a pull request's commits are built by its pull_request run, so only develop needs one for pushes
on:
  push:
    branches: [develop]
  pull_request:

# it only reads the code
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle downloads and checks the wrapper jar is a genuine Gradle release
      - uses: gradle/actions/setup-gradle@v4

      # xvfb gives the GUI test a virtual display to open its window on
      - name: Build and test
        run: xvfb-run ./gradlew build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
