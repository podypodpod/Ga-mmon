apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'checkstyle'

version = '1.0'
sourceCompatibility = 1.8

checkstyle {
    ignoreFailures = true
}

// The tests change settings and write them to file, so give them a fresh copy of conf/ to work on
def testConfDir = layout.buildDirectory.dir('test-conf')

tasks.register('prepareTestConf', Sync) {
    from 'conf'
    into testConfDir
}

test {
    dependsOn 'prepareTestConf'
    systemProperty 'gammon.confDir', testConfDir.get().asFile.absolutePath
}

jar {
    manifest {
        attributes 'Implementation-Title': 'Ga-mmon',
                'Implementation-Version': version
    }
}

dependencies {

    // MAIN
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.20'
    // reload4j is the maintained, drop-in replacement for log4j 1.2, so log4j.properties still works
    implementation group: 'org.slf4j', name: 'slf4j-reload4j', version: '2.0.20'
    implementation group: 'ch.qos.reload4j', name: 'reload4j', version: '1.2.27'
    implementation group: 'commons-io', name: 'commons-io', version: '2.22.0'
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.48'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.48'

    // TEST
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.27.7'

}


repositories {
    mavenCentral()
}
