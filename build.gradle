apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'checkstyle'

version = '1.0'
sourceCompatibility = 1.8

checkstyle {
    ignoreFailures = true
}

// The tests change settings and write them to file, so give them a fresh copy of conf/ to work on
def testConfDir = layout.buildDirectory.dir('test-conf')

tasks.register('prepareTestConf', Sync) {
    from 'conf'
    into testConfDir
}

test {
    dependsOn 'prepareTestConf'
    systemProperty 'gammon.confDir', testConfDir.get().asFile.absolutePath
}

jar {
    manifest {
        attributes 'Implementation-Title': 'Ga-mmon',
                'Implementation-Version': version
    }
}

dependencies {

    // MAIN
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.+'
    implementation group: 'org.slf4j', name: 'slf4j-log4j12', version: '1.7.21'
    implementation group: 'commons-io', name: 'commons-io', version: '2.5'
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.34'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.34'

    // TEST
    testImplementation group: 'junit', name: 'junit', version: '4.+'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.8.0'
    testImplementation group: 'org.mockito', name: 'mockito-all', version: '1.9.5'

}


repositories {
    mavenCentral()
}
