plugins {
    id 'java'
    id 'idea'
    id 'checkstyle'
}

version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:removal']
}

checkstyle {
    ignoreFailures = true
}

// The tests change settings and write them to file, so give them a fresh copy of conf/ to work on.
// TestConfListener does the same when the tests are run some other way, such as from IntelliJ.
def testConfDir = layout.buildDirectory.dir('test-conf')

tasks.register('prepareTestConf', Sync) {
    from 'conf'
    into testConfDir
}

// Players the tests save go here instead of savedPlayers/, emptied before each run
def testPlayersDir = layout.buildDirectory.dir('test-players')

tasks.register('cleanTestPlayers', Delete) {
    delete testPlayersDir
}

test {
    useJUnitPlatform()
    dependsOn 'prepareTestConf', 'cleanTestPlayers'
    systemProperty 'gammon.confDir', testConfDir.get().asFile.absolutePath
    systemProperty 'gammon.playersDir', testPlayersDir.get().asFile.absolutePath
}

// Games make a lot of short-lived objects and don't need short pauses, which suits this collector over the default:
// it took about 10% off the GA, and a little more off a single thread. A JVM flag, so it only applies to what's
// started from here
def collector = '-XX:+UseParallelGC'

// Runs the GA with the settings in conf/
tasks.register('ga', JavaExec) {
    group = 'application'
    description = 'Runs the GA'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'uk.co.davidlomas.gammon.genes.StartGa'
    jvmArgs collector
    // with areBothAIs off, a person plays player 2 from here
    standardInput = System.in
}

// Opens the main menu, whose Start Search button runs the same GA as the task above
tasks.register('menu', JavaExec) {
    group = 'application'
    description = 'Opens the main menu'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'uk.co.davidlomas.gammon.gui.MainMenuContainerFrame'
    jvmArgs collector
    // with areBothAIs off, a person plays player 2 from the console
    standardInput = System.in
}

// Measures the GA's players against a fixed reference player, and how fast games are, and adds a row to
// benchmarks.csv. About two minutes on 12 cores. -Pgenerations, -Pseeds and -Pmeetings change how much it plays
tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Measures player strength and game speed, and adds a row to benchmarks.csv'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'uk.co.davidlomas.gammon.genes.Benchmark'
    args = [project.findProperty('generations') ?: '60', project.findProperty('seeds') ?: '3',
            project.findProperty('meetings') ?: '1000', 'benchmarks.csv']
    jvmArgs collector
    // the players it evolves aren't saved, but keep anything that is out of savedPlayers/
    systemProperty 'gammon.playersDir', layout.buildDirectory.dir('benchmark-players').get().asFile.absolutePath
}

jar {
    manifest {
        attributes 'Implementation-Title': 'Ga-mmon',
                'Implementation-Version': version
    }
}

dependencies {

    // MAIN
    implementation 'org.slf4j:slf4j-api:2.0.20'
    // reload4j is the maintained, drop-in replacement for log4j 1.2, so log4j.properties still works
    implementation 'org.slf4j:slf4j-reload4j:2.0.20'
    implementation 'ch.qos.reload4j:reload4j:1.2.27'

    // TEST
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // also needed to compile TestConfListener, which keeps the tests off the real conf/ folder
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    // copies conf/ for TestConfListener
    testImplementation 'commons-io:commons-io:2.22.0'

}


repositories {
    mavenCentral()
}
